# Project-owned OpenOCD configuration for SEGGER J-Link + STM32H7.
# Keeping the adapter and target in one file prevents CLion from starting
# OpenOCD with only the target script (which leaves no transport selected).
source [find interface/jlink.cfg]
transport select swd
source [find target/stm32h7x.cfg]
reset_config srst_only srst_nogate connect_assert_srst
